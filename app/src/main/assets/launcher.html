<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Launcher</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.07);
    --accent: #7c6af7;
    --accent2: #f76ac8;
    --text: #e8e8f0;
    --text-muted: rgba(232,232,240,0.45);
    --radius: 18px;
    --radius-sm: 12px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── WALLPAPER ── */
  #wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 20% 10%, #1a0d3a 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, #0d1f3a 0%, transparent 55%),
                radial-gradient(ellipse at 60% 40%, #1a0d2a 0%, transparent 40%),
                #07070e;
  }
  #wallpaper::after {
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
  }

  /* ── MAIN SCREENS ── */
  #screen-home, #screen-app-drawer, #screen-add, #screen-loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .screen-hidden { opacity: 0 !important; pointer-events: none !important; transform: translateY(20px) !important; }

  /* ── STATUS BAR ── */
  #status-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 36px; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--text-muted);
  }

  /* ── HOME SCREEN ── */
  #screen-home {
    justify-content: space-between;
    padding: 52px 0 0;
  }

  #home-top {
    padding: 20px 24px 0;
    flex-shrink: 0;
  }

  #date-display {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    font-family: 'Space Mono', monospace;
  }

  #time-display {
    font-size: 58px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    margin-top: 2px;
    background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #home-categories {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 0;
    scroll-snap-type: y proximity;
  }
  #home-categories::-webkit-scrollbar { display: none; }

  .cat-section {
    margin-bottom: 20px;
    scroll-snap-align: start;
    animation: fadeUp 0.4s ease both;
  }

  .cat-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-left: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .cat-label::after {
    content:''; flex:1; height:1px;
    background: var(--border);
  }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .app-icon {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    cursor: pointer;
    animation: fadeUp 0.35s ease both;
  }

  .app-icon-img {
    width: 54px; height: 54px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .app-icon-img::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
  }
  .app-icon:active .app-icon-img {
    transform: scale(0.88);
    background: var(--surface-hover);
  }

  .app-icon-label {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    max-width: 60px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.2;
  }

  /* ── DOCK ── */
  #dock {
    margin: 0 16px 32px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
    gap: 4px;
  }

  .dock-icon {
    display: flex; flex-direction: column;
    align-items: center; gap: 5px;
    cursor: pointer;
  }
  .dock-icon-img {
    width: 50px; height: 50px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .dock-icon:active .dock-icon-img { transform: scale(0.88); }
  .dock-icon-img::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  }

  #btn-add-dock {
    width: 50px; height: 50px;
    border-radius: 14px;
    border: 1.5px dashed rgba(255,255,255,0.2);
    background: transparent;
    color: var(--text-muted);
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  #btn-add-dock:active { background: var(--surface); transform: scale(0.9); }

  /* ── APP DRAWER ── */
  #screen-app-drawer {
    justify-content: flex-start;
    padding-top: 52px;
  }

  #drawer-header {
    padding: 20px 20px 12px;
    flex-shrink: 0;
  }

  #drawer-title {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 14px;
  }

  #search-bar {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-bar:focus { border-color: rgba(124,106,247,0.5); }
  #search-bar::placeholder { color: var(--text-muted); }

  #drawer-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 20px;
  }
  #drawer-list::-webkit-scrollbar { display: none; }

  .drawer-cat-section { margin-bottom: 22px; }

  .drawer-cat-label {
    font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 8px; padding-left: 2px;
  }

  .drawer-app-row {
    display: flex; align-items: center; gap: 14px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .drawer-app-row:active { background: var(--surface-hover); }

  .drawer-app-ico {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .drawer-app-ico::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
  }

  .drawer-app-name {
    font-size: 15px;
    font-weight: 400;
  }

  .drawer-app-cat {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .delete-btn {
    margin-left: auto;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(247,106,107,0.12);
    border: none;
    color: #f76a6b;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .drawer-app-row:hover .delete-btn,
  .drawer-app-row.show-del .delete-btn { opacity: 1; }

  /* ── ADD SCREEN ── */
  #screen-add {
    justify-content: flex-start;
    padding-top: 52px;
    overflow-y: auto;
  }
  #screen-add::-webkit-scrollbar { display: none; }

  #add-header {
    padding: 20px 20px 0;
    flex-shrink: 0;
  }

  #add-title { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  #add-subtitle { font-size: 13px; color: var(--text-muted); }

  #add-form {
    padding: 20px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }

  .form-field label {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); display: block; margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: rgba(124,106,247,0.5); }
  .form-input::placeholder { color: var(--text-muted); }

  #category-preview {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 14px;
    min-height: 44px;
    display: flex; align-items: center; gap: 10px;
    color: var(--text-muted);
    transition: all 0.3s ease;
  }
  #category-preview.filled {
    border-color: rgba(124,106,247,0.4);
    color: var(--text);
  }
  #cat-emoji { font-size: 20px; }
  #cat-text { font-size: 13px; }

  #ai-status {
    font-size: 12px; color: var(--accent);
    min-height: 18px;
    display: flex; align-items: center; gap: 6px;
    font-family: 'Space Mono', monospace;
  }

  .dot-pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s infinite;
  }

  .emoji-picker {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .emoji-opt {
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--surface);
    border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .emoji-opt:active { transform: scale(0.9); }
  .emoji-opt.selected { border-color: var(--accent); background: rgba(124,106,247,0.15); }

  #btn-add-app {
    margin: 0 20px 20px;
    padding: 15px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    width: calc(100% - 40px);
    transition: opacity 0.2s, transform 0.15s;
  }
  #btn-add-app:active { transform: scale(0.97); opacity: 0.85; }
  #btn-add-app:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── NAV BAR ── */
  #nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 60px; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    gap: 40px;
    padding-bottom: 8px;
  }

  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .nav-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
  .nav-btn:active { transform: scale(0.9); }

  /* ── LOADING SCREEN ── */
  #screen-loading {
    align-items: center; justify-content: center;
    gap: 16px;
    background: var(--bg);
    z-index: 300;
  }
  #loading-logo {
    font-size: 48px;
    animation: spin 2s linear infinite;
  }
  #loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,40,0.95);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    padding: 10px 18px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 500;
    white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── CATEGORY COLORS ── */
  .cat-social .app-icon-img,  .cat-social .drawer-app-ico  { background: rgba(29,161,242,0.12); border-color: rgba(29,161,242,0.2); }
  .cat-games .app-icon-img,   .cat-games .drawer-app-ico   { background: rgba(168,85,247,0.12); border-color: rgba(168,85,247,0.2); }
  .cat-tools .app-icon-img,   .cat-tools .drawer-app-ico   { background: rgba(34,197,94,0.12);  border-color: rgba(34,197,94,0.2);  }
  .cat-media .app-icon-img,   .cat-media .drawer-app-ico   { background: rgba(251,146,60,0.12); border-color: rgba(251,146,60,0.2); }
  .cat-finance .app-icon-img, .cat-finance .drawer-app-ico { background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.2); }
  .cat-health .app-icon-img,  .cat-health .drawer-app-ico  { background: rgba(239,68,68,0.12);  border-color: rgba(239,68,68,0.2);  }
  .cat-edu .app-icon-img,     .cat-edu .drawer-app-ico     { background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.2); }
  .cat-travel .app-icon-img,  .cat-travel .drawer-app-ico  { background: rgba(14,165,233,0.12); border-color: rgba(14,165,233,0.2); }
  .cat-shop .app-icon-img,    .cat-shop .drawer-app-ico    { background: rgba(244,63,94,0.12);  border-color: rgba(244,63,94,0.2);  }
  .cat-other .app-icon-img,   .cat-other .drawer-app-ico   { background: rgba(148,163,184,0.1); border-color: rgba(148,163,184,0.15); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50%      { opacity:0.3; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px;
    gap: 12px;
    text-align: center;
  }
  .empty-state-icon { font-size: 48px; opacity: 0.4; }
  .empty-state-text { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="wallpaper"></div>

<!-- STATUS BAR -->
<div id="status-bar">
  <span id="status-time">--:--</span>
  <span id="status-date">---</span>
</div>

<!-- LOADING -->
<div id="screen-loading">
  <div id="loading-logo">✦</div>
  <div id="loading-text">loading launcher...</div>
</div>

<!-- HOME -->
<div id="screen-home" class="screen-hidden">
  <div id="home-top">
    <div id="date-display"></div>
    <div id="time-display"></div>
  </div>
  <div id="home-categories"></div>
  <div id="dock">
    <!-- pinned apps rendered here -->
    <div id="btn-add-dock" onclick="showScreen('add')" title="Add app">+</div>
  </div>
</div>

<!-- APP DRAWER -->
<div id="screen-app-drawer" class="screen-hidden">
  <div id="drawer-header">
    <div id="drawer-title">All Apps</div>
    <input id="search-bar" type="text" placeholder="search apps..." oninput="filterDrawer(this.value)">
  </div>
  <div id="drawer-list"></div>
</div>

<!-- ADD APP -->
<div id="screen-add" class="screen-hidden">
  <div id="add-header">
    <div id="add-title">Add App</div>
    <div id="add-subtitle">AI will auto-categorize for you</div>
  </div>
  <div id="add-form">
    <div class="form-field">
      <label>App Name</label>
      <input class="form-input" id="input-appname" type="text" placeholder="e.g. Spotify, WhatsApp..."
        oninput="onAppNameInput(this.value)">
    </div>
    <div class="form-field">
      <label>App URL / Package (optional)</label>
      <input class="form-input" id="input-appurl" type="text" placeholder="https://... or app package">
    </div>
    <div class="form-field">
      <label>Icon</label>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>
    <div class="form-field">
      <label>Category (AI detected)</label>
      <div id="category-preview">
        <span id="cat-emoji">◌</span>
        <span id="cat-text">type an app name above...</span>
      </div>
      <div id="ai-status"></div>
    </div>
  </div>
  <button id="btn-add-app" onclick="submitAddApp()" disabled>Add to Launcher</button>
</div>

<!-- NAV BAR -->
<div id="nav-bar">
  <button class="nav-btn" id="nav-home" onclick="showScreen('home')" title="Home">⊙</button>
  <button class="nav-btn" id="nav-drawer" onclick="showScreen('drawer')" title="All Apps">⊞</button>
  <button class="nav-btn" id="nav-add" onclick="showScreen('add')" title="Add App">⊕</button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let apps = JSON.parse(localStorage.getItem('launcher_apps') || '[]');
let detectedCat = null;
let selectedEmoji = '📱';
let aiDebounce = null;
const EMOJIS = ['📱','🎮','🎵','📸','🎬','🛠️','📚','💬','🌐','🏃','🛒','💰','✈️','❤️','⚙️','🔑','🗂️','🎨','📊','🔔','🌙','⭐','🔮','🧩','🏠','📡','🧪','🗺️'];

const CATEGORY_META = {
  social:   { label:'Social',      emoji:'💬', cls:'cat-social'  },
  games:    { label:'Games',       emoji:'🎮', cls:'cat-games'   },
  tools:    { label:'Tools',       emoji:'🛠️', cls:'cat-tools'   },
  media:    { label:'Media',       emoji:'🎬', cls:'cat-media'   },
  finance:  { label:'Finance',     emoji:'💰', cls:'cat-finance' },
  health:   { label:'Health',      emoji:'❤️', cls:'cat-health'  },
  education:{ label:'Education',   emoji:'📚', cls:'cat-edu'     },
  travel:   { label:'Travel',      emoji:'✈️', cls:'cat-travel'  },
  shopping: { label:'Shopping',    emoji:'🛒', cls:'cat-shop'    },
  other:    { label:'Other',       emoji:'⭐', cls:'cat-other'   },
};

// ══════════════════════════════════════════════
//  CLOCK
// ══════════════════════════════════════════════
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const days  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months= ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const timeStr = `${hh}:${mm}`;
  const dateStr = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  document.getElementById('time-display').textContent = timeStr;
  document.getElementById('date-display').textContent = dateStr;
  document.getElementById('status-time').textContent  = timeStr;
  document.getElementById('status-date').textContent  = `${months[now.getMonth()]} ${now.getDate()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ══════════════════════════════════════════════
//  SCREEN NAV
// ══════════════════════════════════════════════
let currentScreen = 'loading';
function showScreen(s) {
  ['home','drawer','add','loading'].forEach(id => {
    const el = document.getElementById(`screen-${id === 'drawer' ? 'app-drawer' : id}`);
    if(el) el.classList.add('screen-hidden');
  });
  const map = {home:'screen-home', drawer:'screen-app-drawer', add:'screen-add', loading:'screen-loading'};
  const el = document.getElementById(map[s]);
  if(el) el.classList.remove('screen-hidden');

  // nav highlight
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navMap = {home:'nav-home', drawer:'nav-drawer', add:'nav-add'};
  if(navMap[s]) document.getElementById(navMap[s])?.classList.add('active');

  currentScreen = s;
  if(s === 'home')   renderHome();
  if(s === 'drawer') renderDrawer();
}

// ══════════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════════
function saveApps() {
  localStorage.setItem('launcher_apps', JSON.stringify(apps));
}

// ══════════════════════════════════════════════
//  RENDER HOME
// ══════════════════════════════════════════════
function renderHome() {
  const container = document.getElementById('home-categories');
  container.innerHTML = '';

  if(apps.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">✦</div>
      <div class="empty-state-text">No apps yet.<br>Tap + to add your first app.</div>
    </div>`;
    return;
  }

  const grouped = groupByCategory(apps);
  let delay = 0;
  for(const [cat, list] of Object.entries(grouped)) {
    const meta = CATEGORY_META[cat] || CATEGORY_META.other;
    const sec = document.createElement('div');
    sec.className = 'cat-section';
    sec.style.animationDelay = `${delay}ms`;

    const grid = list.map((app,i) => `
      <div class="app-icon ${meta.cls}" style="animation-delay:${delay + i*40}ms"
        onclick="launchApp('${app.id}')" oncontextmenu="deleteApp(event,'${app.id}')">
        <div class="app-icon-img">${app.emoji}</div>
        <div class="app-icon-label">${escHtml(app.name)}</div>
      </div>`).join('');

    sec.innerHTML = `
      <div class="cat-label">${meta.emoji} ${meta.label}</div>
      <div class="app-grid">${grid}</div>`;
    container.appendChild(sec);
    delay += 60;
  }

  // dock — last 4 added apps
  renderDock();
}

function renderDock() {
  const dock = document.getElementById('dock');
  const addBtn = document.getElementById('btn-add-dock');
  // clear existing dock icons
  dock.querySelectorAll('.dock-icon').forEach(d => d.remove());

  const pinned = apps.slice(-4);
  pinned.forEach(app => {
    const meta = CATEGORY_META[app.category] || CATEGORY_META.other;
    const div = document.createElement('div');
    div.className = `dock-icon ${meta.cls}`;
    div.innerHTML = `<div class="dock-icon-img">${app.emoji}</div>`;
    div.onclick = () => launchApp(app.id);
    dock.insertBefore(div, addBtn);
  });
}

// ══════════════════════════════════════════════
//  RENDER DRAWER
// ══════════════════════════════════════════════
function renderDrawer(filter = '') {
  const container = document.getElementById('drawer-list');
  container.innerHTML = '';
  const q = filter.toLowerCase();
  const filtered = apps.filter(a => a.name.toLowerCase().includes(q));

  if(filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">${filter ? '🔍' : '✦'}</div>
      <div class="empty-state-text">${filter ? 'No apps match "'+escHtml(filter)+'"' : 'No apps added yet.'}</div>
    </div>`;
    return;
  }

  const grouped = groupByCategory(filtered);
  for(const [cat, list] of Object.entries(grouped)) {
    const meta = CATEGORY_META[cat] || CATEGORY_META.other;
    const sec = document.createElement('div');
    sec.className = 'drawer-cat-section';
    sec.innerHTML = `<div class="drawer-cat-label">${meta.emoji} ${meta.label}</div>`;
    list.forEach(app => {
      const row = document.createElement('div');
      row.className = `drawer-app-row ${meta.cls}`;
      row.innerHTML = `
        <div class="drawer-app-ico">${app.emoji}</div>
        <div>
          <div class="drawer-app-name">${escHtml(app.name)}</div>
          <div class="drawer-app-cat">${meta.label}</div>
        </div>
        <button class="delete-btn" onclick="deleteApp(event,'${app.id}')">✕</button>`;
      row.addEventListener('click', (e) => {
        if(!e.target.closest('.delete-btn')) launchApp(app.id);
      });
      row.addEventListener('contextmenu', (e) => deleteApp(e, app.id));
      sec.appendChild(row);
    });
    container.appendChild(sec);
  }
}

function filterDrawer(val) { renderDrawer(val); }

// ══════════════════════════════════════════════
//  GROUP BY CATEGORY
// ══════════════════════════════════════════════
function groupByCategory(list) {
  const catOrder = ['social','games','media','tools','finance','health','education','travel','shopping','other'];
  const map = {};
  list.forEach(app => {
    const cat = app.category || 'other';
    if(!map[cat]) map[cat] = [];
    map[cat].push(app);
  });
  const sorted = {};
  catOrder.forEach(c => { if(map[c]) sorted[c] = map[c]; });
  Object.keys(map).forEach(c => { if(!sorted[c]) sorted[c] = map[c]; });
  return sorted;
}

// ══════════════════════════════════════════════
//  ADD APP
// ══════════════════════════════════════════════
function buildEmojiPicker() {
  const picker = document.getElementById('emoji-picker');
  picker.innerHTML = '';
  EMOJIS.forEach(e => {
    const opt = document.createElement('div');
    opt.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
    opt.textContent = e;
    opt.onclick = () => {
      selectedEmoji = e;
      document.querySelectorAll('.emoji-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    };
    picker.appendChild(opt);
  });
}

function onAppNameInput(val) {
  clearTimeout(aiDebounce);
  const btn = document.getElementById('btn-add-app');
  btn.disabled = true;
  detectedCat = null;

  if(!val.trim()) {
    setPreview(null);
    setAiStatus('');
    return;
  }

  setAiStatus('detecting...');
  aiDebounce = setTimeout(() => detectCategory(val.trim()), 800);
}

async function detectCategory(name) {
  setAiStatus('<span class="dot-pulse"></span> asking AI...');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:80,
        messages:[{
          role:'user',
          content:`Categorize this mobile app into exactly ONE of these categories: social, games, media, tools, finance, health, education, travel, shopping, other.

App name: "${name}"

Reply with ONLY the category word, nothing else. No explanation.`
        }]
      })
    });
    const data = await res.json();
    const raw = (data.content?.[0]?.text || '').trim().toLowerCase().replace(/[^a-z]/g,'');
    const valid = Object.keys(CATEGORY_META);
    const cat = valid.includes(raw) ? raw : 'other';
    detectedCat = cat;
    setPreview(cat);
    setAiStatus('✓ categorized');
    document.getElementById('btn-add-app').disabled = false;
  } catch(e) {
    detectedCat = 'other';
    setPreview('other');
    setAiStatus('⚠ offline — using default');
    document.getElementById('btn-add-app').disabled = false;
  }
}

function setPreview(cat) {
  const preview = document.getElementById('category-preview');
  if(!cat) {
    preview.classList.remove('filled');
    document.getElementById('cat-emoji').textContent = '◌';
    document.getElementById('cat-text').textContent = 'type an app name above...';
    return;
  }
  const meta = CATEGORY_META[cat] || CATEGORY_META.other;
  preview.classList.add('filled');
  document.getElementById('cat-emoji').textContent = meta.emoji;
  document.getElementById('cat-text').textContent = meta.label;
}

function setAiStatus(html) {
  document.getElementById('ai-status').innerHTML = html;
}

function submitAddApp() {
  const name = document.getElementById('input-appname').value.trim();
  const url  = document.getElementById('input-appurl').value.trim();
  if(!name) return;

  const app = {
    id: Date.now().toString(36),
    name,
    url: url || null,
    emoji: selectedEmoji,
    category: detectedCat || 'other',
    added: Date.now()
  };
  apps.push(app);
  saveApps();
  showToast(`"${name}" added!`);

  // reset form
  document.getElementById('input-appname').value = '';
  document.getElementById('input-appurl').value = '';
  selectedEmoji = '📱';
  buildEmojiPicker();
  detectedCat = null;
  setPreview(null);
  setAiStatus('');
  document.getElementById('btn-add-app').disabled = true;

  showScreen('home');
}

// ══════════════════════════════════════════════
//  LAUNCH / DELETE
// ══════════════════════════════════════════════
function launchApp(id) {
  const app = apps.find(a => a.id === id);
  if(!app) return;
  if(app.url) {
    window.open(app.url, '_blank');
  } else {
    showToast(`${app.emoji} ${app.name}`);
  }
}

function deleteApp(e, id) {
  e.preventDefault();
  e.stopPropagation();
  const app = apps.find(a => a.id === id);
  if(!app) return;
  if(!confirm(`Remove "${app.name}"?`)) return;
  apps = apps.filter(a => a.id !== id);
  saveApps();
  showToast(`"${app.name}" removed`);
  renderHome();
  if(currentScreen === 'drawer') renderDrawer();
}

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
window.addEventListener('load', () => {
  buildEmojiPicker();
  setTimeout(() => showScreen('home'), 1200);
});
</script>
